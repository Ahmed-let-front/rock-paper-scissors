<!doctype html>
<html lang="en" class="overflow-x-hidden">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A modern, responsive Rock, Paper, Scissors, Lizard, Spock web application built with Vite and Tailwind CSS. Play against the computer, track scores, and enjoy a clean UI."
    />
    <script type="module" src="/src/js/main.js"></script>
    <title>rock-paper-scissors-lizard-spock</title>
  </head>
  <body class="flex flex-col items-center px-4 pt-8 md:pt-12">
    <header
      class="flex w-full max-w-[45rem] items-center justify-between rounded-xl border-[3px] border-header-outline py-3 pr-3 pl-4 md:rounded-2xl md:py-6 md:pr-6 md:pl-8"
    >
      <h1 class="text-sm leading-[0.9] font-bold uppercase md:text-2xl">
        Rock<br />Paper<br />Scissors<br />Lizard<br />Spock
      </h1>
      <div class="score-box">
        <p class="score-label">Score</p>
        <output id="score" class="score-value" aria-live="polite">0</output>
      </div>
    </header>

    <main
      class="flex w-full flex-1 items-center justify-center py-10"
      aria-live="polite"
      id="main"
    >
      <template id="picker-template">
        <div id="picker" class="picker template-view">
          <h2 class="sr-only">Choose your move</h2>
          <img
            src="/src/assets/images/bg-pentagon.svg"
            alt="Pentagon background guide showing layout connections for game choices"
            class="absolute top-[15.8%] left-[15.3%] -z-10 w-[69.4%]"
          />
          <button
            type="button"
            class="token token-btn token-scissors"
            data-choice="scissors"
            aria-label="Scissors"
          >
            <span class="token-face"
              ><img
                src="/src/assets/images/icon-scissors.svg"
                alt="Scissors token graphic showing two blades"
                class="token-icon"
            /></span>
          </button>
          <button
            type="button"
            class="token token-btn token-paper"
            data-choice="paper"
            aria-label="Paper"
          >
            <span class="token-face"
              ><img
                src="/src/assets/images/icon-paper.svg"
                alt="Paper token graphic showing a flat sheet"
                class="token-icon"
            /></span>
          </button>
          <button
            type="button"
            class="token token-btn token-rock"
            data-choice="rock"
            aria-label="Rock"
          >
            <span class="token-face"
              ><img
                src="/src/assets/images/icon-rock.svg"
                alt="Rock token graphic showing a boulder"
                class="token-icon"
            /></span>
          </button>
          <button
            type="button"
            class="token token-btn token-lizard"
            data-choice="lizard"
            aria-label="Lizard"
          >
            <span class="token-face"
              ><img
                src="/src/assets/images/icon-lizard.svg"
                alt="Lizard token graphic showing a reptile head"
                class="token-icon"
            /></span>
          </button>
          <button
            type="button"
            class="token token-btn token-spock"
            data-choice="spock"
            aria-label="Spock"
          >
            <span class="token-face"
              ><img
                src="/src/assets/images/icon-spock.svg"
                alt="Spock token graphic showing a hand sign"
                class="token-icon"
            /></span>
          </button>
        </div>
      </template>

      <template id="result-template">
        <div id="result" class="result template-view">
          <h2 class="sr-only">Round result</h2>
          <div class="pick">
            <h3 class="pick-title">You picked</h3>
            <div id="player-pick" class="pick-slot"></div>
          </div>
          <div class="outcome" id="containerReset" inert>
            <p id="outcome-text" class="outcome-text" role="status"></p>
            <button id="play-again" type="button" class="btn-play">Play again</button>
          </div>
          <div class="pick md:order-last">
            <h3 class="pick-title">The house picked</h3>
            <div id="house-pick" class="pick-slot">
              <div class="token-placeholder flex justify-center items-center">
                <div class="flex items-center justify-center space-x-2">
                  <span
                    class="size-3 md:size-4 bg-fg rounded-full animate-bounce [animation-delay:-0.3s]"
                  ></span>
                  <span
                    class="size-3 md:size-4 bg-fg rounded-full animate-bounce [animation-delay:-0.15s]"
                  ></span>
                  <span class="size-3 md:size-4 bg-fg rounded-full animate-bounce"></span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </template>
    </main>

    <footer class="flex w-full items-center justify-between pb-8 md:px-8">
      <button
        id="theme-toggle"
        type="button"
        class="btns-footer flex items-center justify-center"
        aria-label="Toggle theme"
      >
        <svg class="size-3 md:size-5 mr-3" aria-hidden="true">
          <use href="/src/assets/images/icon-moon.svg" />
        </svg>
        dark
      </button>

      <p class="hidden text-center text-xs md:block">
        Challenge by
        <a
          href="https://www.frontendmentor.io?ref=challenge"
          target="_blank"
          rel="noopener noreferrer"
          class="font-medium underline transition-opacity hover:opacity-80"
          >Frontend Mentor</a
        >. Coded by
        <a
          href="https://github.com/Ahmed-let-front"
          target="_blank"
          rel="noopener noreferrer"
          class="font-medium underline transition-opacity hover:opacity-80"
          >Ahmed Yasser</a
        >.
      </p>

      <button
        id="rules-open"
        type="button"
        popovertarget="rules-modal"
        popovertargetaction="toggle"
        class="btns-footer"
        aria-haspopup="dialog"
      >
        Rules
      </button>
    </footer>

    <dialog
      id="rules-modal"
      popover
      class="modal m-auto h-dvh max-h-none w-dvw max-w-none flex-col items-center rounded-none bg-surface px-4 py-12 text-dark-text open:flex md:h-auto md:w-[25rem] md:max-h-[30rem] md:rounded-xl md:p-8 md:pb-10 backdrop:bg-overlay duration-400 transition-all transition-discrete backdrop:duration-400 backdrop:transition-all backdrop:transition-discrete starting:backdrop:opacity-0 starting:open:-translate-y-[30rem] starting:open:opacity-0 opacity-0 -translate-y-[30rem] open:translate-0 open:opacity-100"
      aria-labelledby="rules-title"
    >
      <div class="self-stretch flex justify-between items-center">
        <h2
          id="rules-title"
          class="modal-title text-center text-[1.5rem] font-bold uppercase md:text-left"
        >
          Rules
        </h2>
        <button
          id="rules-close"
          type="button"
          class="modal-close cursor-pointer"
          aria-label="Close rules"
          popovertarget="rules-modal"
          popovertargetaction="hide"
        >
          <img src="/src/assets/images/icon-close.svg" alt="Close modal button icon" />
        </button>
      </div>
      <div class="h-full flex justify-center items-center">
        <img
          src="/src/assets/images/image-rules-bonus.svg"
          alt="Scissors beat paper and lizard, paper beats rock and Spock, rock beats lizard and scissors, lizard beats Spock and paper, Spock beats scissors and rock"
          class="w-[15rem] md:w-[19rem]"
        />
      </div>
    </dialog>
  </body>
</html>
